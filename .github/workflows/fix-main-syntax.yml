name: One-time syntax fix
on:
  push:
    branches: [feat/multi-platform-trend-radar]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-platform-trend-radar
      - name: Fix main.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          old = "} }; document.querySelectorAll('[data-delete-account]"
          new = " }; document.querySelectorAll('[data-delete-account]"
          if old not in s:
              raise SystemExit('target syntax fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/main.js
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git rm .github/workflows/fix-main-syntax.yml
          git commit -m "fix: repair main.js account binding syntax"
          git push origin HEAD:feat/multi-platform-trend-radar
