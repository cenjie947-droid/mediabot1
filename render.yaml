services:
  - type: web
    name: creator-os
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TOUTIAO_BRIDGE_URL
        sync: false
      - key: REDFOX_API_KEY
        sync: false
      - key: REDFOX_BASE_URL
        sync: false
      - key: REDFOX_DOUYIN_SOURCE
        sync: false
      - key: REDFOX_TREND_ENDPOINTS_JSON
        sync: false
  - type: cron
    name: creator-os-publisher
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: REDFOX_API_KEY
        sync: false
      - key: REDFOX_BASE_URL
        sync: false
      - key: REDFOX_DOUYIN_SOURCE
        sync: false
      - key: REDFOX_TREND_ENDPOINTS_JSON
        sync: false
